<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Craft 系统 · 管理端</title>
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <div class="app-progress" id="appProgress" hidden>
    <div class="app-progress-fill" id="appProgressFill"></div>
    <div class="app-progress-text" id="appProgressText"></div>
  </div>
  <div class="layout">
    <!-- 左侧导航 -->
    <aside class="sidebar">
      <div class="brand">Craft 系统</div>
      <nav class="nav">
        <a href="javascript:;" class="nav-item active" data-view="materials">物料及分组</a>
        <a href="javascript:;" class="nav-item nav-parent" data-view="settings">系统设置<span class="nav-caret">▸</span></a>
        <a href="javascript:;" class="nav-item nav-sub" data-view="settings" data-sub="dict">字典设置</a>
        <a href="javascript:;" class="nav-item nav-sub" data-view="settings" data-sub="set">属性集合</a>
        <a href="javascript:;" class="nav-item nav-sub" data-view="commit">提交管理<span class="nav-badge" id="commitCount" hidden></span></a>
        <a href="icons.html" class="nav-item" target="_blank" rel="noopener">图标库（临时）</a>
        <a href="index.html" class="nav-item">返回官网</a>
      </nav>
    </aside>

    <!-- 右侧主区域 -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbarTitle">物料及分组</div>
        <div class="topbar-actions">
          <span class="repo-chip" id="repoChip"></span>
          <div class="global-material-search" id="globalMaterialSearchWrap">
            <input id="globalMaterialSearch" type="search" placeholder="全局搜索：物料编码 / 名称" autocomplete="off" />
            <div class="global-search-results" id="globalMaterialSearchResults"></div>
          </div>
          <div class="account-menu">
            <button class="avatar" id="avatarBtn" type="button"></button>
            <div class="account-dropdown" id="accountDropdown" hidden>
              <div class="account-name" id="accountName"></div>
              <div class="account-repo" id="accountRepo"></div>
              <button class="account-item" id="switchRepoBtn" type="button">切换数据仓库</button>
              <button class="account-item danger" id="menuLogoutBtn" type="button">退出登录</button>
            </div>
          </div>
        </div>
      </header>
      <section class="content" id="content"></section>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Excel 读写（本地内置，离线可用） -->
  <script src="assets/vendor/xlsx.full.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
